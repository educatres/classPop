<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ClassPop 作答統計</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <div id="config-error" class="error-panel hidden"></div>

    <main id="stats-app" class="shell stats-shell hidden">
      <header class="topbar">
        <div>
          <p class="eyebrow">ClassPop Stats</p>
          <h1>作答統計</h1>
          <p>課堂 ID：<strong id="class-id"></strong></p>
        </div>
        <div class="sync-tools">
          <label class="toolbar-field">
            <span>切換題目</span>
            <select id="question-select">
              <option value="">最後一題</option>
            </select>
          </label>
          <button id="manual-sync" class="ghost-btn" type="button">重新整理</button>
          <span id="sync-status" class="status-text"></span>
        </div>
      </header>

      <section class="panel stats-hero">
        <div class="status-line">
          <span id="question-status" class="status-pill">等待題目</span>
          <span>目前有效作答 <strong id="answer-count">0</strong> 人</span>
        </div>
        <h2 id="stats-question">目前尚未建立題目</h2>
      </section>

      <section class="stats-dashboard">
        <div class="panel stats-panel-large">
          <h2>選項分布</h2>
          <div id="stats-bars" class="stats-bars stats-bars-large"></div>
        </div>

        <div class="panel stats-result-panel">
          <h2>答題結果</h2>
          <div class="stat-cards stat-cards-stack">
            <div><span>總作答</span><strong id="total-answers">0</strong></div>
            <div><span>答對</span><strong id="correct-count">0</strong></div>
            <div><span>答錯</span><strong id="wrong-count">0</strong></div>
            <div><span>答對率</span><strong id="correct-rate">0%</strong></div>
          </div>
        </div>
      </section>

      <section class="panel stats-options">
        <h2>選項內容</h2>
        <div id="option-list" class="option-list"></div>
      </section>
    </main>

    <script type="module" src="js/stats.js"></script>
  </body>
</html>
