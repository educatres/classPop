<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ClassPop 作答</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body class="student-body">
    <div id="config-error" class="error-panel hidden"></div>

    <main id="play-app" class="student-shell hidden">
      <header class="student-topbar">
        <div>
          <p class="eyebrow">ClassPop</p>
          <span>課堂 ID：<strong id="class-id"></strong></span>
        </div>
        <div class="student-tools">
          <button id="sound-toggle" class="ghost-btn small" type="button" aria-pressed="false">🔇 開啟節拍</button>
          <button id="manual-sync" class="ghost-btn small" type="button">重新整理</button>
        </div>
      </header>

      <div class="student-status">
        <span id="question-status" class="status-pill">等待題目</span>
        <span id="sync-status" class="status-text"></span>
      </div>

      <div id="play-content"></div>
    </main>

    <script type="module" src="js/play.js"></script>
  </body>
</html>
