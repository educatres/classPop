<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ClassPop 展示學生</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body class="student-body">
    <main class="student-shell">
      <header class="student-topbar">
        <div>
          <p class="eyebrow">ClassPop Demo</p>
          <span>模擬學生：<strong id="student-name"></strong></span>
        </div>
        <button id="manual-sync" class="ghost-btn small" type="button">重新整理</button>
      </header>

      <div class="student-status">
        <span id="question-status" class="status-pill">等待題目</span>
        <span id="sync-status" class="status-text"></span>
      </div>

      <div id="play-content"></div>
    </main>

    <script type="module" src="js/demo-student.js"></script>
  </body>
</html>
